name: Release

# Publishes to crates.io when a version tag is pushed, but only after the full
# CI and security suites pass on the tagged commit. The slow, advisory mutation
# and link checks are intentionally not part of the release gate.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/rust.yml
    secrets: inherit

  security:
    name: Security gate
    uses: ./.github/workflows/security.yml
    secrets: inherit

  publish:
    name: Publish to crates.io
    needs: [ci, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to mint a short-lived crates.io token via OIDC trusted
      # publishing (no long-lived CARGO_REGISTRY_TOKEN secret needed).
      id-token: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Verify the tag matches the crate version
      run: |
        set -euo pipefail
        tag="${GITHUB_REF_NAME#v}"
        version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
        if [ "$tag" != "$version" ]; then
          echo "::error::tag '${GITHUB_REF_NAME}' does not match Cargo.toml version '${version}'"
          exit 1
        fi
        echo "Releasing version ${version}."
    - name: Authenticate to crates.io
      uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      id: auth
    - name: Publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      run: cargo publish --locked
