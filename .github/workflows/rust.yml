name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allow the release workflow to reuse these checks as a publish gate.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta, nightly]
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  features:
    name: Feature Combinations
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Check with no default features
      run: cargo check --no-default-features
    - name: Test with no default features
      run: cargo test --no-default-features
    - name: Test no_std + alloc
      run: cargo test --no-default-features --features alloc
    - name: Test no_std + alloc + hashbrown
      run: cargo test --no-default-features --features "alloc hashbrown"
    - name: Test all features
      run: cargo test --all-features

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rustfmt
    - name: Check formatting
      run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: Run clippy
      run: cargo clippy --all-targets -- -D warnings

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Check documentation
      run: cargo doc --no-deps --document-private-items
      env:
        RUSTDOCFLAGS: -D warnings


  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install tarpaulin
      run: cargo install cargo-tarpaulin
    - name: Install nightly toolchain for doctest coverage
      run: |
        set -euo pipefail
        rustup set profile minimal
        for attempt in 1 2 3; do
          if rustup toolchain install nightly --component cargo; then
            exit 0
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "Failed to install nightly toolchain after 3 attempts" >&2
            exit 1
          fi
          echo "Retrying nightly toolchain install (${attempt}/3)"
          sleep 5
        done
    - name: Generate coverage
      run: cargo +nightly tarpaulin --engine=llvm --out xml --workspace --all-features --run-types AllTargets --run-types Doctests
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  no-python:
    name: No Python
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Reject committed Python files
      run: |
        set -euo pipefail
        matches="$(git ls-files '*.py' '*.pyw' '*.pyi' '*.ipynb')"
        if [ -n "$matches" ]; then
          echo "::error::Python files are not allowed in this repository:"
          echo "$matches"
          exit 1
        fi
        echo "No Python files found."

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust 1.88
      uses: dtolnay/rust-toolchain@1.88
    - name: Check (all features)
      run: cargo check --all-features
    - name: Check (no_std + alloc)
      run: cargo check --no-default-features --features alloc

  miri:
    name: Miri (unsafe)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install nightly with Miri
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: miri
    # Scoped to the modules that contain `unsafe`, where Miri adds value over
    # the rest of the suite. Strict provenance is not enabled because a
    # dependency performs integer-to-pointer casts; default Miri still detects
    # genuine undefined behavior.
    - name: Run Miri on the unsafe-bearing modules
      run: cargo miri test --lib -- transmute_from sorted_array sorted_vec partitioned johnson

  no-std:
    name: no_std target build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust with a bare-metal target
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: thumbv7em-none-eabi
    - name: Check core-only on a bare-metal target
      run: cargo check --no-default-features --target thumbv7em-none-eabi
    - name: Check alloc on a bare-metal target
      run: cargo check --no-default-features --features alloc --target thumbv7em-none-eabi

  semver:
    name: SemVer (API compatibility)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Advisory while the crate is pre-1.0 and unpublished: reports API breaks
    # against the base branch without blocking. Promote to a required check
    # against the crates.io baseline once the crate is published.
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Check semver
      uses: obi1kenobi/cargo-semver-checks-action@v2
      with:
        baseline-rev: ${{ github.event.pull_request.base.sha }}
