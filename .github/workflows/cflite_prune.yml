name: ClusterFuzzLite corpus pruning

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC, an hour before batch fuzzing
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  Pruning:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Build Fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
      - name: Run Fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # each target's merge deadline is an even share of this, and a merge ends as soon as it is done
          fuzz-seconds: 3600
          mode: prune
          storage-repo: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          storage-repo-branch: fuzz-corpus
