name: Links

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: "00 18 * * *"
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Link Checker
        uses: lycheeverse/lychee-action@2b973e86fc7b1f6b36a93795fe2c9c6ae1118621 # v1.10.0
        with:
          args: >-
            --verbose
            --no-progress
            --exclude '^https://codecov\.io/gh/earth-metabolome-initiative/geometric-traits(/.*)?$'
            --exclude '^https://doi\.org/10\.3115/981732\.981751/?$'
            './**/*.md'
            './**/*.html'
          fail: true
