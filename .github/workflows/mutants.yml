name: Mutation audit

on:
  schedule:
    - cron: "0 3 * * 1" # Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      source_file:
        description: "Rust source file under src to audit (blank uses the scheduled algorithm rotation)"
        required: false
        default: ""
      shard_index:
        description: "1-based shard index within the file (default 1)"
        required: false
        default: "1"
      batch_size:
        description: "Maximum candidates per batch, 1 to 20 (default 20)"
        required: false
        default: "20"

permissions:
  contents: read

concurrency:
  group: mutation-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Mutation batch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@f0d5300ba8908d942c808f4d31c08471d7798ba3
        with:
          toolchain: stable
      - name: Install cargo-mutants 27.1.0
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-mutants@27.1.0
      - name: Verify cargo-mutants version
        run: |
          version="$(cargo mutants --version)"
          if [ "$version" != "cargo-mutants 27.1.0" ]; then
            echo "::error::expected cargo-mutants 27.1.0, got $version"
            exit 1
          fi
      - name: Run bounded mutation batch
        env:
          SOURCE_FILE: ${{ inputs.source_file }}
          SHARD_INDEX: ${{ inputs.shard_index }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: bash .github/scripts/mutation_audit.sh
      - name: Publish audit summary
        if: always()
        run: |
          if [ -f mutation-audit-summary.md ]; then
            cat mutation-audit-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The mutation audit summary was not written. See the run log." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mutation-audit-summary.md
            mutation-audit.*/
          if-no-files-found: warn
          retention-days: 30
