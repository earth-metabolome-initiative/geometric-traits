# SonarQube Cloud analysis configuration. The organization and project keys
# come from the SonarQube Cloud project import and must match it exactly.
sonar.organization=earth-metabolome-initiative
sonar.projectKey=earth-metabolome-initiative_geometric-traits
sonar.projectName=geometric-traits

sonar.sources=src,benches
# Integration tests live in tests/. Inline #[cfg(test)] modules stay
# classified as sources, which is the Rust reality.
sonar.tests=tests
sonar.exclusions=**/target/**
# Compressed ground-truth and fuzz-crash inputs, not analyzable code.
sonar.test.exclusions=tests/fixtures/**
sonar.sourceEncoding=UTF-8
